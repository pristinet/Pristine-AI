<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Cohort | Pristine AI Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f1f5f9; scroll-behavior: smooth; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.08); }
        .text-gradient { background: linear-gradient(to right, #60a5fa, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .input-field { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); transition: all 0.3s ease; }
        .input-field:focus { border-color: #3b82f6; background: rgba(59, 130, 246, 0.05); outline: none; box-shadow: 0 0 20px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="overflow-x-hidden">

    <!-- SECTION 1: THE WELCOME HEADER -->
    <section class="pt-20 pb-12 px-6 text-center relative">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-blue-600/10 blur-[100px] -z-10"></div>
        <div class="max-w-3xl mx-auto">
            <a href="home.html" class="inline-flex items-center gap-2 text-slate-500 hover:text-blue-400 transition mb-8 font-black text-[10px] uppercase tracking-[0.3em]">
                <i class="fa-solid fa-arrow-left"></i> Back to Home
            </a>
            <h1 class="text-4xl md:text-6xl font-black mb-6">Your <span class="text-gradient">New Life</span> Starts Here.</h1>
            <p class="text-slate-400 text-lg">You are applying for the MAY Cohort in Makeni. This is the first step toward working less and earning more.</p>
        </div>
    </section>

    <!-- SECTION 2: FORM -->
    <section class="py-12 pb-32 px-6">
        <div class="max-w-3xl mx-auto glass p-8 md:p-16 rounded-[60px] shadow-2xl relative">
            <div class="absolute -top-6 right-10 bg-white text-black px-6 py-2 rounded-full font-black text-[10px] uppercase tracking-widest shadow-xl">
                Limited Seats Left
            </div>

            <!-- UPDATE: Action points to Formspree with your email -->
            <form action="https://formspree.io/f/xlgzejzv" method="POST" class="space-y-10">
                
                <!-- Hidden field to ensure data is sent to your email -->
                <input type="hidden" name="_replyto" value="pristine978@gmail.com">
                <input type="hidden" name="_subject" value="New AI Academy Application!">

                <!-- Part 1: Identity -->
                <div class="space-y-6">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-xs font-bold">1</span>
                        <h2 class="text-xl font-bold">Who are you?</h2>
                    </div>
                    <div class="grid md:grid-cols-2 gap-6">
                        <input type="text" name="full_name" placeholder="Full Name" class="w-full input-field p-5 rounded-3xl text-sm" required>
                        <input type="tel" name="whatsapp_number" placeholder="WhatsApp Number" class="w-full input-field p-5 rounded-3xl text-sm" required>
                    </div>
                    <select name="role" class="w-full input-field p-5 rounded-3xl text-sm appearance-none cursor-pointer" required>
                        <option value="" disabled selected>Select your current role...</option>
                        <option value="Student">University Student (I want to study better)</option>
                        <option value="Employee">Employee (I want a promotion/easier work)</option>
                        <option value="Business Owner">Business Owner (I want to grow my sales)</option>
                        <option value="Creative">Creative/Freelancer (I want to build content)</option>
                    </select>
                </div>

                <hr class="border-white/5">

                <!-- Part 2: Goals -->
                <div class="space-y-6">
                    <div class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-full bg-purple-600 flex items-center justify-center text-xs font-bold">2</span>
                        <h2 class="text-xl font-bold">Your AI Vision</h2>
                    </div>
                    <div class="space-y-4">
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-widest ml-2">What is the #1 thing you want AI to do for you?</label>
                        <textarea name="goals" rows="4" placeholder="Be honest! Do you want to write emails? Build a business? Win a scholarship?" class="w-full input-field p-6 rounded-[35px] text-sm" required></textarea>
                    </div>
                </div>

                <!-- Part 3: Confirmation -->
                <div class="pt-6">
                    <button type="submit" class="group relative w-full bg-white text-black p-6 rounded-[35px] font-black text-xl hover:bg-blue-500 hover:text-white transition-all shadow-2xl overflow-hidden">
                        <span class="relative z-10">Secure My Spot Now</span>
                        <div class="absolute inset-0 bg-gradient-to-r from-blue-600 to-purple-600 translate-y-full group-hover:translate-y-0 transition-transform duration-500"></div>
                    </button>
                    <p class="text-center mt-6 text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">
                        <i class="fa-solid fa-shield-halved mr-2 text-blue-500"></i> Your data is safe with Pristine AI
                    </p>
                </div>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-10 text-center border-t border-white/5">
        <p class="text-[10px] font-bold text-slate-600 uppercase tracking-widest">Designed by Pristine AI Team • Makeni 2026</p>
    </footer>

</body>
</html>
